[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsiino-herbarium-validator"
version = "0.1.0"
description = "FastAPI backend for herbarium spreadsheet validation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "python-slugify>=8.0",
  "pyshp>=2.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["reference*", "scripts*", "downloads*"]

[tool.ruff]
line-length = 100