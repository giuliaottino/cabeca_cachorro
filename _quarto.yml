
project:
  output-dir: docs
  type: website
  render:
    - index.qmd
    - acesso/index.qmd
    - expedicoes/index.qmd
    - ferramentas/validador-herbario/index.qmd
    - team/index.qmd

  # Regenera o módulo 3D das expedições (expedicoes/3d/data.js) a partir de
  # _input_data/expedicoes_3d.json, dos KMLs e das pastas de fotos.
  pre-render: scripts/build_expedicoes_3d.py

  resources:
    - expedicoes/3d/index.html
    - expedicoes/3d/data.js
    - figures/**
    - js/**
    - css/**
    - assets/**
    - test_data/**

website:
  title: "Tsiino Hiiwiida"
  page-navigation: true
  reader-mode: false
  search: false
  favicon: "figures/tsiino_hex_sticker.png"

  navbar:
    search: false
    background: light
    collapse-below: lg
    type: light
    logo: "figures/tsiino_hex_sticker.png"
    href: index.qmd

    left:
      - text: "Sobre"
        href: index.qmd

      - text: "Expedições"
        href: expedicoes/index.qmd

      - text: "Acesso aos dados"
        menu:
          - text: "Visão geral"
            href: acesso/index.qmd

      - text: "Ferramentas"
        menu:
          - text: "Validador de planilha de herbário"
            href: ferramentas/validador-herbario/index.qmd

      - text: "Equipe"
        href: team/index.qmd

format:
  html:
    toc: true
    embed-resources: false
    self-contained: false
    code-copy: true
    code-overflow: wrap
    code-tools: false

    css:
      - styles.css

    eval: true
    theme: [spacelab, theme.scss]
    include-in-header: gtm-head.html
    include-before-body: gtm-body.html

    include-after-body:
      - tsiino-footer.html
      - _includes/language-router.html
