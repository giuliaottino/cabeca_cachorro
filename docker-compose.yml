# API do validador para desenvolvimento local (http://127.0.0.1:8000).
# As bases de referência ficam em backend/reference/ (não versionadas; copie do repositório do Space
# ou gere com backend/scripts/build_ffb_sqlite.py e build_ibge_sqlite.py).
services:
  api:
    build:
      context: ./backend
    container_name: tsiino_validator_api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
